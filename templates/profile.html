{% extends "base.html" %}

{% block head %}
<title>Update Profile</title>
{% endblock %}

{% block body %}
<div class="container-md">
  <h2>Edit Profile</h2>

  <div class="card mt-3">
    <div class="card-body">
      <form class="form" action="{{ url_for('profile.update_profile') }}" method="POST">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" name="username" value="{{ current_user.username }}" class="form-control" disabled>
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" name="name" value="{{ current_user.name }}" class="form-control">
        </div>
        <div class="mb-3">
          <label for="contact_details" class="form-label">Contact Details</label>
          <input type="text" name="contact_details" value="{{ current_user.contact_details }}" class="form-control">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password (8-15 characters)</label>
          <input type="text" name="password" class="form-control" placeholder="Leave blank for current password" minlength="8" maxlength="15">
        </div>

        <div class="d-flex justify-content-center">
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>
  
</div>
{% endblock %}
