{% extends "base.html" %}

{% block body %}
<div class="container mt-4">
    <h2>Pending Staff Applications</h2>
    <hr>
    {% if staff_list %}
    <table class="table table-hover">
        <thead class="table-dark">
            <tr>
                <th>Username</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for staff in staff_list %}
            <tr>
                <td>{{ staff.username }}</td>
                <td>
                    <a href="{{ url_for('admin.approve', id=staff.id) }}" class="btn btn-success btn-sm">Approve</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="alert alert-info">No pending staff applications at this time.</div>
    {% endif %}
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
</div>
{% endblock %}
