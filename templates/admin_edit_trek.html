{% extends "base.html" %}
{% block head%}
<title>Admin Edit Trek</title>
{% endblock %}

{% block body %}
<div class="container mt-4">
    <h2>Edit Trek: {{ trek.name }}</h2>
    <form method="POST">
        <input type="text" name="name" class="form-control mb-2" value="{{ trek.name }}" required>
        <input type="text" name="location" class="form-control mb-2" value="{{ trek.location }}" required>
        
        <select name="difficulty" class="form-select mb-2">
            {% for diff in ['EASY', 'MODERATE', 'HARD'] %}
                <option value="{{ diff }}" {% if trek.difficulty.name == diff %}selected{% endif %}>{{ diff }}</option>
            {% endfor %}
        </select>
        
        <input type="number" name="slots" class="form-control mb-2" value="{{ trek.available_slots }}" required>

        <label>Assign Staff</label>
        <select name="staff_id" class="form-select mb-2">
            <option value="">None</option>
            {% for staff in staff_members %}
                <option value="{{ staff.id }}" {% if trek.staff_id == staff.id %}selected{% endif %}>
                    {{ staff.username }}
                </option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-success">Update Trek</button>
        <a href="{{ url_for('admin.manage_treks') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
